[project]
name = "job-finder"
version = "0.1.0"
description = "A CV-aware job discovery web application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "ollama>=0.4,<1.0",
    "jinja2>=3.1,<4.0",
    "langsmith>=0.2,<1.0",
    "pypdf>=5.0,<6.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["Tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["CV", "Database", "Ingestion", "Search", "Interface"]
